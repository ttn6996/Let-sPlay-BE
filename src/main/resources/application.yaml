spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: letsplay-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/letsplay}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${PORT:${SERVER_PORT:8082}}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  self-ping:
    interval-ms: 300000
  push:
    vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${PUSH_VAPID_SUBJECT:mailto:admin@letsplay.app}
