spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: letsplay-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/letsplay}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8082}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175}
