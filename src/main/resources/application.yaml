spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: letsplay-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/letsplay}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: ${PORT:${SERVER_PORT:8082}}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
  self-ping:
    interval-ms: 300000
  push:
    vapid-public-key: ${PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${PUSH_VAPID_SUBJECT:mailto:admin@letsplay.app}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  storage:
    order: ${STORAGE_PROVIDER_ORDER:google_drive,cloudinary,local}
    base-url: ${APP_BASE_URL:http://localhost:8082}
    google-drive:
      service-account-json: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:}
      service-account-file: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE:}
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:letsplay/moments}
    local:
      upload-dir: ${LOCAL_UPLOAD_DIR:./uploads/media}
